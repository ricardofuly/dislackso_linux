name: Build e publicar release

# Dispara quando uma tag de versão é enviada (ex.: v4.1.0), ou na mão pelo
# Actions/gh (workflow_dispatch) apontando pra uma tag já existente — útil
# pra rebuildar sem apagar e recriar a tag, ex.: depois de corrigir este
# próprio workflow.
#
# Builda Windows e Linux em paralelo e publica os artefatos + latest*.yml
# direto no Release correspondente a essa tag — sem precisar de WSL nem
# de rodar `npm run dist` na mão em cada plataforma.
#
# O owner/repo de destino já vem do "build.publish" no package.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release já publicada (ex.: v4.0.3)'
        required: true

permissions:
  contents: write   # necessário pro electron-builder criar/editar o Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_portable: true
          - os: ubuntu-latest
            build_portable: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Necessário só no Linux, pra empacotar o target "rpm".
      - name: Instalar ferramentas de empacotamento rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      # Mesma sequência do script "dist" do package.json, mas publicando
      # de verdade (upload dos instaladores + latest.yml / latest-linux.yml)
      # no Release da tag que disparou o workflow. A tag/versão que o
      # electron-builder usa vem do "version" do package.json que acabou de
      # ser baixado no checkout acima — não depende de GITHUB_REF_NAME.
      - name: Build e publish (installers)
        run: npm run icon && npm run build:desktop && node scripts/prep-build.js && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Versão portátil (.zip) — só existe hoje pro Windows (scripts/pack-portable.js).
      # "npm run portable" gera a pasta em dist/DiSlackso-portable (não em
      # release/) — o "cd release" sozinho, sem apontar pra pasta certa,
      # foi o que quebrou o zip na primeira tentativa (7z não achava nada
      # pra compactar). É um bônus, não o instalador principal: uma falha
      # aqui não pode travar o job inteiro nem o aviso de atualização.
      - name: Gerar versão portátil (Windows)
        if: matrix.build_portable
        shell: bash
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          npm run portable
          cd dist
          7z a "../release/DiSlackso-portable-${RELEASE_TAG#v}.zip" DiSlackso-portable

      - name: Subir versão portátil no Release
        if: matrix.build_portable
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          # Sem isto, essa action só acha a release sozinha quando o próprio
          # push da tag disparou o workflow — rodando via workflow_dispatch
          # (GITHUB_REF é a branch, não a tag) ela não sabia em qual release
          # subir o zip e pulava em silêncio.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release/DiSlackso-portable-*.zip

  # Só depois que os dois builds da matriz acima terminam (needs: build) --
  # avisar antes disso deixaria quem clicasse em "atualizar" com um download
  # quebrado, porque o instalador ainda não estaria no Release.
  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Avisar quem está com o app aberto agora
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "Secret ADMIN_KEY não configurado neste repositório -- pulando aviso automático."
            exit 0
          fi
          BASE="${SERVER_URL:-https://dislackso.onrender.com}"
          BODY=$(printf '{"key":"%s","version":"%s"}' "$ADMIN_KEY" "$RELEASE_TAG")
          curl -fsS -X POST "$BASE/api/admin/notify-update" -H "Content-Type: application/json" -d "$BODY"
