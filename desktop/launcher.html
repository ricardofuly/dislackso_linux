<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DiSlackso</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 25% 15%, #3b45c9 0%, #17181b 55%);
    color: #dbdee1;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .drag { height: 32px; flex: none; -webkit-app-region: drag; }
  main { flex: 1; display: grid; place-items: center; padding: 20px 24px 32px; overflow: auto; }
  .wrap { width: min(720px, 100%); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .brand h1 { font-size: 26px; color: #fff; letter-spacing: -.01em; }
  .sub { color: #a8adb5; margin-bottom: 28px; font-size: 14px; }
  .recent { margin: 0 0 18px; padding: 13px 14px; border-radius: 12px; display:flex; align-items:center; gap:12px;
            background:rgba(88,101,242,.14); border:1px solid rgba(124,137,255,.32); }
  .recent .copy { flex:1; min-width:0; } .recent b { color:#fff; display:block; font-size:13px; }
  .recent span { color:#aeb6ff; display:block; font:12px ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: rgba(43,45,49,.72);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 14px; padding: 20px;
    cursor: pointer;
    transition: transform .18s cubic-bezier(.2,.8,.3,1), border-color .18s, background .18s;
    text-align: left; color: inherit; font: inherit;
    display: block; width: 100%;
  }
  .card:hover { transform: translateY(-3px); border-color: #5865f2; background: rgba(53,56,62,.85); }
  .card.on { border-color: #5865f2; background: rgba(53,56,62,.9); }
  .card h2 { font-size: 16px; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .card p { font-size: 13px; color: #a8adb5; }
  .card .ico { width: 20px; height: 20px; flex: none; }

  .panel {
    margin-top: 16px; background: rgba(30,31,34,.8);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 14px; padding: 20px;
  }
  label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em;
          text-transform: uppercase; color: #949ba4; margin-bottom: 7px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 11px 12px; border-radius: 8px;
    background: #17181b; border: 1px solid #2c2e33; color: #fff; outline: none;
    font: inherit; transition: border-color .15s;
  }
  input:focus { border-color: #5865f2; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > div { flex: 1; }

  button.go {
    padding: 11px 20px; border-radius: 8px; border: 0; cursor: pointer;
    background: #5865f2; color: #fff; font: 500 15px/1 inherit; white-space: nowrap;
    transition: background .15s, transform .12s;
  }
  button.go:hover { background: #4752c4; }
  button.go:active { transform: scale(.97); }
  button.go[disabled] { opacity: .55; cursor: default; transform: none; }
  button.ghost { background: #383a40; }
  button.ghost:hover { background: #4a4d54; }

  .out { margin-top: 16px; font-size: 13.5px; }
  .addr {
    display: flex; align-items: center; gap: 8px; justify-content: space-between;
    background: #17181b; border: 1px solid #2c2e33; border-radius: 8px;
    padding: 9px 12px; margin-top: 7px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #fff;
    word-break: break-all;
  }
  .addr button { flex: none; background: #383a40; border: 0; color: #dbdee1; cursor: pointer;
                 border-radius: 6px; padding: 5px 10px; font-size: 12px; }
  .addr button:hover { background: #5865f2; color: #fff; }
  .hint { color: #949ba4; font-size: 12.5px; margin-top: 10px; }
  .err { color: #ff8c8c; font-size: 13px; margin-top: 10px; }
  .ok { color: #5ecb87; }

  .opts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px;
          border-top: 1px solid rgba(255,255,255,.07); }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a8adb5; cursor: pointer; }
  .opt input { accent-color: #5865f2; width: 15px; height: 15px; }
  footer { text-align: center; color: #6d7178; font-size: 11.5px; margin-top: 18px; }
  .hidden { display: none !important; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3);
          border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 100 100" width="38" height="38"><rect width="100" height="100" rx="24" fill="#5865f2"/><rect x="22" y="30" width="56" height="36" rx="6" fill="#fff"/><rect x="42" y="70" width="16" height="6" rx="3" fill="#fff"/></svg>
      <h1>DiSlackso</h1>
    </div>
    <p class="sub">Escolha como você quer usar o app.</p>
    <div id="recent" class="recent hidden">
      <div class="copy"><b>Continuar no último servidor</b><span id="recent-url"></span></div>
      <button class="go" id="btn-recent">Entrar</button>
    </div>

    <div class="cards">
      <button class="card" id="card-host">
        <h2>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
          Hospedar aqui
        </h2>
        <p>Seu PC vira o servidor. Seus amigos se conectam a você. Nada sai da sua máquina.</p>
      </button>
      <button class="card" id="card-connect">
        <h2>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          Conectar
        </h2>
        <p>Entrar num servidor que já existe — de um amigo ou hospedado na nuvem.</p>
      </button>
    </div>

    <!-- hospedar -->
    <div class="panel hidden" id="panel-host">
      <div class="row">
        <div style="max-width:140px">
          <label for="port">Porta</label>
          <input type="number" id="port" value="3000" min="1024" max="65535">
        </div>
        <button class="go" id="btn-host">Iniciar servidor</button>
      </div>
      <div class="out hidden" id="host-out"></div>
      <div class="err hidden" id="host-err"></div>
    </div>

    <!-- conectar -->
    <div class="panel hidden" id="panel-connect">
      <label for="url">Endereço do servidor</label>
      <div class="row">
        <div><input type="text" id="url" placeholder="https://algo.trycloudflare.com" spellcheck="false"></div>
        <button class="go" id="btn-connect">Entrar</button>
      </div>
      <p class="hint">Pode ser o link que seu amigo mandou, ou <code>http://192.168.x.x:3000</code> na mesma rede.</p>
      <div class="err hidden" id="conn-err"></div>
    </div>

    <div class="opts">
      <label class="opt"><input type="checkbox" id="hw"> Aceleração de hardware</label>
      <label class="opt"><input type="checkbox" id="tr"> Transparência da janela (Windows 11)</label>
      <span class="hint" style="margin:0">Alterar aqui reinicia o app.</span>
    </div>
    <footer id="ver"></footer>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const show = (el, on) => el.classList.toggle('hidden', !on);

let cfg = {};
let hostInfo = null;

(async () => {
  cfg = await window.desktop.getConfig();
  $('#port').value = cfg.port || 3000;
  $('#url').value = cfg.url || '';
  $('#hw').checked = cfg.hardwareAcceleration !== false;
  $('#tr').checked = !!cfg.transparency;

  if (cfg.url) {
    $('#recent-url').textContent = cfg.url;
    show($('#recent'), true);
  }

  const info = await window.desktop.info();
  $('#ver').textContent = `versão ${info.version} · Electron ${info.electron} · dados em ${info.dataDir}`;

  // Abre direto no painel do último modo usado.
  if (cfg.mode === 'connect') selectMode('connect');
  else if (cfg.mode === 'host') selectMode('host');
})();

$('#btn-recent').onclick = () => {
  if (!cfg.url) return;
  window.desktop.open(cfg.url).catch((err) => {
    $('#conn-err').textContent = 'Não foi possível abrir: ' + (err.message || err);
    selectMode('connect'); show($('#conn-err'), true);
  });
};

function selectMode(mode) {
  show($('#panel-host'), mode === 'host');
  show($('#panel-connect'), mode === 'connect');
  $('#card-host').classList.toggle('on', mode === 'host');
  $('#card-connect').classList.toggle('on', mode === 'connect');
}

$('#card-host').onclick = () => selectMode('host');
$('#card-connect').onclick = () => selectMode('connect');

/* ---- hospedar ---- */

$('#btn-host').onclick = async () => {
  const btn = $('#btn-host');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Iniciando…';
  show($('#host-err'), false);

  try {
    hostInfo = await window.desktop.hostStart({ port: Number($('#port').value) });
    renderHost();
  } catch (err) {
    $('#host-err').textContent = String(err.message || err).includes('EADDRINUSE')
      ? `A porta ${$('#port').value} já está ocupada. Tente outra, como 3001.`
      : 'Não foi possível iniciar: ' + (err.message || err);
    show($('#host-err'), true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar servidor';
  }
};

function addr(label, value, note) {
  return `<div style="margin-top:12px"><label>${label}</label>
    <div class="addr"><span>${value}</span>
    <button data-copy="${value}">copiar</button></div>
    ${note ? `<p class="hint">${note}</p>` : ''}</div>`;
}

function renderHost() {
  const out = $('#host-out');
  const lan = hostInfo.lan.length ? hostInfo.lan[0] : null;
  out.innerHTML = `
    <p class="ok">✓ Servidor no ar.</p>
    ${addr('Para você', hostInfo.url)}
    ${lan ? addr('Amigos no mesmo Wi-Fi', lan,
      'Só funciona para compartilhar tela se o endereço for HTTPS — rode <code>npm run cert</code> para isso.') : ''}
    <div style="margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap">
      <button class="go ghost" id="btn-tunnel">Criar link público</button>
      <button class="go" id="btn-enter">Abrir o app</button>
    </div>
    <p class="hint">O link público usa o cloudflared e dá um endereço HTTPS que funciona
       de qualquer lugar. Precisa do cloudflared instalado.</p>
    <div id="tunnel-out"></div>`;
  show(out, true);

  $('#btn-enter').onclick = () => window.desktop.open(tunnelPublic || hostInfo.url);
  $('#btn-tunnel').onclick = makeTunnel;
}

let tunnelPublic = '';

async function makeTunnel() {
  const btn = $('#btn-tunnel');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Abrindo túnel…';
  try {
    tunnelPublic = await window.desktop.tunnelStart(hostInfo.url);
    $('#tunnel-out').innerHTML = addr('Link público (mande para os amigos)', tunnelPublic,
      'Válido enquanto o app estiver aberto. Fechar o DiSlackso derruba o link.');
    btn.textContent = 'Link criado';
  } catch (err) {
    $('#tunnel-out').innerHTML =
      `<p class="err">${err.message || err}. Instale com:</p>
       <div class="addr"><span>winget install --id Cloudflare.cloudflared</span>
       <button data-copy="winget install --id Cloudflare.cloudflared">copiar</button></div>`;
    btn.disabled = false;
    btn.textContent = 'Tentar de novo';
  }
}

/* ---- conectar ---- */

$('#btn-connect').onclick = () => {
  let url = $('#url').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  window.desktop.setConfig({ mode: 'connect', url });
  window.desktop.open(url).catch((err) => {
    $('#conn-err').textContent = 'Endereço inválido: ' + (err.message || err);
    show($('#conn-err'), true);
  });
};

$('#url').onkeydown = (e) => { if (e.key === 'Enter') $('#btn-connect').click(); };

/* ---- opcoes que exigem reinicio ---- */

for (const [id, key] of [['#hw', 'hardwareAcceleration'], ['#tr', 'transparency']]) {
  $(id).onchange = async (e) => {
    await window.desktop.setConfig({ [key]: e.target.checked });
    window.desktop.restart();
  };
}

/* ---- copiar ---- */

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  navigator.clipboard.writeText(btn.dataset.copy);
  const old = btn.textContent;
  btn.textContent = 'copiado!';
  setTimeout(() => { btn.textContent = old; }, 1400);
});
</script>
</body>
</html>
